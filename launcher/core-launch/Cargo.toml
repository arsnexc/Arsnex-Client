[package]
name    = "arsex-launch"
version = "1.0.0"
edition = "2021"
description = "Arsex Client — real Minecraft launch pipeline (manifest, libraries, assets, classpath, mods)"

# Deliberately NO tauri dependency. This crate is the launch engine and must be
# buildable and testable on any host, including CI without a GUI stack.

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow     = "1"
sha1       = "0.10"
sha2       = "0.10"
hex        = "0.4"
zip        = { version = "0.6", default-features = false, features = ["deflate"] }
reqwest    = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
toml       = "0.8"

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json","rustls-tls","blocking"] }
